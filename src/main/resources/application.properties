spring.application.name=auth-api
server.port=${AUTH_API_PORT:8081}

# Misma instancia y base PostgreSQL que scoring-api; auth-api solo usa el esquema "auth".
# AUTH_DB_URL tiene el formato postgresql://host:puerto/base (Spring agrega el prefijo jdbc:).
spring.datasource.url=jdbc:${AUTH_DB_URL:}
spring.datasource.username=${AUTH_DB_USERNAME:}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=auth

# Flyway solo gestiona el esquema "auth" y guarda su historial en auth.flyway_schema_history.
# El esquema debe existir previamente (lo crea el administrador de la base, no la aplicación).
spring.flyway.enabled=true
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
spring.flyway.create-schemas=false

# JWT RS256. Las claves se leen de archivos externos (p. ej. file:/ruta/clave-privada.pem); nunca se versionan.
auth.jwt.emisor=${AUTH_JWT_ISSUER:auth-api}
auth.jwt.audiencias=${AUTH_JWT_AUDIENCES:auth-api,scoring-api,evaluation-query-api}
auth.jwt.audiencia-propia=auth-api
auth.jwt.id-clave=${AUTH_JWT_KEY_ID}
auth.jwt.clave-privada=${AUTH_JWT_PRIVATE_KEY_LOCATION}
auth.jwt.clave-publica=${AUTH_JWT_PUBLIC_KEY_LOCATION}
auth.jwt.duracion-acceso=15m

auth.sesion.duracion-renovacion=7d
# PBKDF2-HMAC-SHA256: 600 000 iteraciones (recomendación OWASP); calibrar por ambiente, nunca a la baja
auth.pbkdf2.iteraciones=${AUTH_PBKDF2_ITERATIONS:600000}

# Cookie del token de renovación
auth.cookie.nombre=refresh_token
auth.cookie.ruta=/api/v1/auth
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}

# Orígenes permitidos (CORS y validación de Origin en renovación y cierre de sesión)
auth.web.origenes-permitidos=${AUTH_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger deshabilitado por defecto; se habilita con el perfil "dev".
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
